<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" fill="#fff"/><text x="34" y="38" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#19324e">Minimum-image convention across periodic boundaries</text><rect x="95" y="89" width="320" height="210" stroke="#64748b" stroke-width="3" fill="#f8fafc"/><rect x="415" y="89" width="320" height="210" stroke="#94a3b8" stroke-width="3" fill="#fff"/><circle cx="119" cy="196" r="12" fill="#2563eb"/><circle cx="391" cy="196" r="12" fill="#e87927"/><circle cx="439" cy="196" r="9" fill="#2563eb"/><path d="M391 196 L439 196" stroke="#0d9488" stroke-width="5"/><text x="95" y="327" fill="#334155" font-family="Arial,sans-serif" font-size="17">Periodic cell A</text><text x="496" y="327" fill="#334155" font-family="Arial,sans-serif" font-size="17">Periodic image B</text><text x="325" y="166" fill="#334155" font-family="Arial,sans-serif" font-size="17">Short crossing</text><text x="165" y="72" fill="#334155" font-family="Arial,sans-serif" font-size="17">Use the closest periodic image for pair displacement</text><text x="34" y="375" font-family="Arial,sans-serif" font-size="14" fill="#64748b">The closest separation may cross the apparent simulation-cell boundary.</text></svg>