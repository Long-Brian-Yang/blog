<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390"><rect width="960" height="390" fill="#fff"/><text x="30" y="39" font-family="Arial" font-size="23" font-weight="bold" fill="#19324e">Active learning: sample, detect, label, retrain</text><g font-family="Arial" font-size="18" fill="#334155" text-anchor="middle"><rect x="125" y="106" width="235" height="78" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="242" y="149">Sample structures</text><rect x="596" y="106" width="235" height="78" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="713" y="149">Flag uncertain cases</text><rect x="596" y="242" width="235" height="78" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="713" y="285">DFT label selection</text><rect x="125" y="242" width="235" height="78" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="242" y="285">Retrain and validate</text></g><path d="M365 144 H585 M714 187 V234 M588 281 H372 M242 237 V190" fill="none" stroke="#0d9488" stroke-width="4"/><text x="363" y="340" font-size="16" font-family="Arial" fill="#475569">Stop only after target-property validation and adequate coverage</text><text x="30" y="368" font-family="Arial" font-size="14" fill="#64748b">Uncertainty triggers and data selection must be calibrated and periodically audited.</text></svg>