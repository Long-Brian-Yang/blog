<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><rect width="900" height="390" fill="#fff"/><text x="32" y="37" font-size="23" font-family="Arial" font-weight="bold" fill="#19324e">Born–Oppenheimer: electrons adapt to nuclear positions</text><rect x="60" y="96" width="210" height="160" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><rect x="346" y="96" width="210" height="160" rx="18" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/><rect x="633" y="96" width="210" height="160" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><g font-family="Arial" fill="#19324e" text-anchor="middle"><text x="165" y="133" font-size="21">Fix nuclei R</text><text x="165" y="189" font-size="16">Nuclear positions</text><text x="451" y="133" font-size="21">Solve electrons</text><text x="451" y="185" font-size="16">Electronic energy E(R)</text><text x="738" y="133" font-size="21">Update nuclei</text><text x="738" y="185" font-size="16">Forces and dynamics</text></g><path d="M272 175 H336 M558 175 H622" stroke="#475569" stroke-width="3"/><path d="M333 168 l11 7 -11 7 M619 168 l11 7 -11 7" stroke="#475569" stroke-width="2" fill="none"/><text x="35" y="369" font-size="14" font-family="Arial" fill="#64748b">The approximation neglects explicit nonadiabatic couplings in its simplest form.</text></svg>