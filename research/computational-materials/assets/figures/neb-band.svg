<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390"><rect width="920" height="390" fill="#fff"/><text x="46" y="38" font-family="Arial" font-size="22" font-weight="bold" fill="#172b4d">NEB: a chain of full atomic configurations</text><path d="M85 260 C225 275 245 88 460 102 C640 115 690 269 837 259" fill="none" stroke="#3b82f6" stroke-width="5"/><path d="M85 260 L210 191 L335 126 L460 102 L585 141 L710 220 L837 259" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 7" fill="none"/><g font-family="Arial" text-anchor="middle" font-size="16" fill="#334155"><circle cx="85" cy="260" r="17" fill="#1d4ed8"/><circle cx="210" cy="191" r="14" fill="#60a5fa"/><circle cx="335" cy="126" r="14" fill="#60a5fa"/><circle cx="460" cy="102" r="14" fill="#ea580c"/><circle cx="585" cy="141" r="14" fill="#60a5fa"/><circle cx="710" cy="220" r="14" fill="#60a5fa"/><circle cx="837" cy="259" r="17" fill="#1d4ed8"/><text x="85" y="303">A</text><text x="210" y="224">I₁</text><text x="335" y="159">I₂</text><text x="460" y="70">I₃</text><text x="585" y="174">I₄</text><text x="710" y="253">I₅</text><text x="837" y="302">B</text></g><text x="49" y="347" fill="#475569" font-size="16" font-family="Arial">Each circle is an image: a complete set of atomic coordinates, not one moving atom.</text><text x="49" y="370" fill="#475569" font-size="14" font-family="Arial">Schematic only · blue curve suggests an optimized path; orange dashed line connects discrete images.</text></svg>