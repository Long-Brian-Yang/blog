<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><rect width="900" height="350" fill="white"/><text x="30" y="38" font-size="23" font-family="Arial" fill="#18334c" font-weight="bold">Self diffusion vs collective charge transport</text><g fill="none" stroke-width="4"><path d="M110 194 C155 134 227 144 283 105" stroke="#2563eb"/><path d="M110 239 C171 189 230 206 283 167" stroke="#0d9488"/><path d="M530 194 C580 130 659 141 744 109" stroke="#2563eb"/><path d="M530 239 C591 288 669 278 744 226" stroke="#0d9488"/></g><g font-family="Arial" font-size="18" fill="#334155"><text x="90" y="77">Correlated motion</text><text x="538" y="77">Different displacement correlations</text><text x="115" y="299">Cross terms can enhance conductivity</text><text x="540" y="299">or reduce conductivity</text></g><text x="30" y="332" font-family="Arial" font-size="14" fill="#64748b">Signs and magnitudes of correlation terms depend on species and motion.</text></svg>