<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><rect width="900" height="390" fill="#fff"/><text x="32" y="37" font-size="23" font-family="Arial" font-weight="bold" fill="#19324e">Kohn–Sham DFT: self-consistent electron density</text><rect x="55" y="104" width="192" height="133" rx="12" fill="#eff6ff" stroke="#93c5fd"/><rect x="346" y="104" width="192" height="133" rx="12" fill="#f0fdfa" stroke="#5eead4"/><rect x="638" y="104" width="192" height="133" rx="12" fill="#fff7ed" stroke="#fdba74"/><g font-family="Arial" font-size="18" fill="#334155" text-anchor="middle"><text x="151" y="147">Trial density</text><text x="151" y="179">n(r)</text><text x="442" y="147">KS equations</text><text x="442" y="179">orbitals and n&#8242;(r)</text><text x="733" y="147">Compare densities</text><text x="733" y="179">SCF converged?</text></g><path d="M249 169 H340 M540 169 H633 M730 244 V290 H144 V241" stroke="#0d9488" stroke-width="3" fill="none"/><path d="M333 163 l11 6 -11 6 M628 163 l11 6 -11 6 M138 252 l6 -12 6 12" fill="#0d9488"/><text x="330" y="315" font-family="Arial" font-size="17" fill="#0f766e">If not converged: mix density and iterate</text><text x="35" y="369" font-size="14" font-family="Arial" fill="#64748b">Simplified Kohn–Sham SCF loop; DFT accuracy depends on approximations and numerical settings.</text></svg>