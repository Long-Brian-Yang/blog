<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><rect width="900" height="390" fill="#fff"/><text x="32" y="37" font-size="23" font-family="Arial" font-weight="bold" fill="#19324e">Statistical ensembles: which quantities fluctuate?</text><g font-family="Arial" text-anchor="middle"><rect x="42" y="98" width="250" height="185" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><rect x="326" y="98" width="250" height="185" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/><rect x="610" y="98" width="250" height="185" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><g font-size="26" font-weight="bold" fill="#19324e"><text x="167" y="141">NVE</text><text x="451" y="141">NVT</text><text x="735" y="141">NPT</text></g><g font-size="17" fill="#475569"><text x="167" y="181">N, V, E fixed</text><text x="167" y="218">T fluctuates</text><text x="451" y="181">N, V, T controlled</text><text x="451" y="218">E fluctuates</text><text x="735" y="181">N, P, T controlled</text><text x="735" y="218">V, E fluctuate</text></g></g><text x="35" y="369" font-size="14" font-family="Arial" fill="#64748b">Ideal ensemble definitions; finite simulations and algorithms introduce practical nuances.</text></svg>