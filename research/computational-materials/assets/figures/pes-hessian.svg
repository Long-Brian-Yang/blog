<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><rect width="900" height="350" fill="white"/><text x="32" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#1e354f">Curvature at stationary points</text><path d="M50 101 Q180 311 315 101" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M345 247 Q479 71 613 247" stroke="#e87927" stroke-width="4" fill="none"/><path d="M649 120 Q744 285 835 120" stroke="#0d9488" stroke-width="4" fill="none"/><g font-family="Arial" text-anchor="middle" font-size="17" fill="#334155"><text x="185" y="310">Positive curvature</text><text x="476" y="310">Negative curvature</text><text x="742" y="310">Direction-dependent</text><text x="185" y="333">Minimum direction</text><text x="480" y="333">Unstable direction</text></g><text x="35" y="333" font-family="Arial" font-size="14" fill="#64748b">A first-order saddle has one unstable curvature direction, not three separate shapes.</text></svg>