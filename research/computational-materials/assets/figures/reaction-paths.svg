<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370"><rect width="900" height="370" fill="#ffffff"/><text x="38" y="40" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#142943">Shortest geometric path is not always the lowest-energy path</text><g fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"><circle cx="450" cy="181" r="83"/><circle cx="450" cy="181" r="57" fill="#cbd5e1"/></g><path d="M120 181 H785" stroke="#ef4444" stroke-dasharray="11 9" stroke-width="4"/><path d="M120 181 C236 181 240 62 443 62 C643 62 651 181 785 181" stroke="#0d9488" stroke-width="5" fill="none"/><circle cx="120" cy="181" r="12" fill="#2563eb"/><circle cx="785" cy="181" r="12" fill="#2563eb"/><g font-family="Arial,sans-serif" font-size="17" fill="#334155"><text x="112" y="222">A</text><text x="782" y="222">B</text><text x="354" y="44" fill="#0d9488">Relaxed curved route</text><text x="360" y="293" fill="#dc2626">Linear interpolation crosses an unfavorable region</text></g><text x="40" y="352" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Schematic paths in a projected configuration space; this is not an NEB result.</text></svg>