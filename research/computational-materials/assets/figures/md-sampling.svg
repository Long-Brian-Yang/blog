<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><rect width="900" height="350" fill="white"/><text x="32" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#1e354f">MD sampling: multiple origins and independent replicas</text><g font-family="Arial" font-size="16" fill="#334155"><text x="52" y="99">Replica A</text><text x="52" y="159">Replica B</text><text x="52" y="219">Replica C</text></g><path d="M160 90 H825" stroke="#94a3b8" stroke-width="3"/><path d="M200 90 H540" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><circle cx="320" cy="90" r="8" fill="#1e293b"/><path d="M160 150 H825" stroke="#94a3b8" stroke-width="3"/><path d="M218 150 H582" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/><circle cx="350" cy="150" r="8" fill="#1e293b"/><path d="M160 210 H825" stroke="#94a3b8" stroke-width="3"/><path d="M236 210 H624" stroke="#e87927" stroke-width="8" stroke-linecap="round"/><circle cx="380" cy="210" r="8" fill="#1e293b"/><g font-family="Arial" font-size="16" fill="#475569"><text x="182" y="266">Colored segments: analysis windows</text><text x="182" y="291">Dots: different time origins</text></g><text x="35" y="333" font-family="Arial" font-size="14" fill="#64748b">Overlapping windows improve sampling but are not independent observations.</text></svg>