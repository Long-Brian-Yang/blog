<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" fill="#fff"/><text x="34" y="38" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#19324e">Local vs global energy minima</text><path d="M70 74 V325 H895" stroke="#64748b" stroke-width="2"/><path d="M90 145 C165 340 239 336 307 267 C400 160 446 145 525 260 C610 350 704 303 776 211 C819 164 858 175 881 209" stroke="#2563eb" stroke-width="5" fill="none"/><circle cx="211" cy="310" r="8" fill="#2563eb"/><circle cx="637" cy="320" r="8" fill="#e87927"/><text x="128" y="294" fill="#334155" font-family="Arial,sans-serif" font-size="17">Local minimum</text><text x="585" y="350" fill="#334155" font-family="Arial,sans-serif" font-size="17">Deeper minimum</text><text x="460" y="95" fill="#334155" font-family="Arial,sans-serif" font-size="17">Different basins can trap a local optimizer</text><text x="34" y="375" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Illustrative one-dimensional energy profile; minima are not necessarily equally accessible.</text></svg>