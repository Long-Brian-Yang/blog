<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" fill="#fff"/><text x="34" y="38" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#19324e">Separation of electronic and nuclear timescales</text><path d="M80 270 H890" stroke="#64748b" stroke-width="2"/><path d="M85 157 L105 110 L135 207 L165 110 L195 207 L225 110 L255 207 L285 110 L315 207 L345 110 L375 207 L405 110 L435 207 L465 110 L495 207 L525 110 L555 207 L585 110 L615 207 L645 110 L675 207 L705 110 L735 207 L765 110 L795 207 L825 110" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M85 233 C250 206 365 240 510 173 S755 110 886 155" stroke="#e87927" stroke-width="5" fill="none"/><text x="110" y="82" fill="#334155" font-family="Arial,sans-serif" font-size="17">Fast electronic response</text><text x="550" y="83" fill="#334155" font-family="Arial,sans-serif" font-size="17">Slower nuclear rearrangement</text><text x="780" y="303" fill="#334155" font-family="Arial,sans-serif" font-size="17">Time →</text><text x="34" y="375" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Qualitative timescales only; nonadiabatic dynamics can couple electronic and nuclear motion.</text></svg>