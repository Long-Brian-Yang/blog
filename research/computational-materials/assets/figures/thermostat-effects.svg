<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><rect width="900" height="350" fill="white"/><text x="30" y="38" font-size="23" font-family="Arial" fill="#18334c" font-weight="bold">Thermostat choice affects dynamics, not only temperature</text><rect x="60" y="91" width="230" height="153" rx="14" fill="#eff6ff" stroke="#93c5fd"/><rect x="336" y="91" width="230" height="153" rx="14" fill="#f0fdfa" stroke="#5eead4"/><rect x="613" y="91" width="230" height="153" rx="14" fill="#fff7ed" stroke="#fdba74"/><g font-family="Arial" fill="#19324e" text-anchor="middle"><text x="175" y="134" font-size="21">Thermostat</text><text x="175" y="175" font-size="17">Controls sampling</text><text x="451" y="134" font-size="21">Trajectory</text><text x="451" y="175" font-size="17">Time correlations</text><text x="728" y="134" font-size="21">Transport</text><text x="728" y="175" font-size="17">Check diffusivity</text></g><path d="M292 164 H330 M568 164 H606" stroke="#64748b" stroke-width="3"/><text x="85" y="289" font-family="Arial" font-size="16" fill="#475569">Compare coupling strength and algorithm; quantify uncertainties.</text><text x="30" y="332" font-family="Arial" font-size="14" fill="#64748b">Workflow concept only: ensemble sampling quality and dynamic fidelity differ.</text></svg>