<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" fill="#fff"/><text x="34" y="38" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#19324e">A path is a one-dimensional slice of a PES</text><g fill="none" stroke="#93c5fd" stroke-width="2"><ellipse cx="480" cy="195" rx="105" ry="45"/><ellipse cx="480" cy="195" rx="168" ry="75"/><ellipse cx="480" cy="195" rx="231" ry="105"/><ellipse cx="480" cy="195" rx="294" ry="135"/></g><path d="M185 250 C335 112 560 102 784 246" stroke="#e87927" fill="none" stroke-width="5"/><circle cx="205" cy="240" r="8" fill="#2563eb"/><circle cx="766" cy="237" r="8" fill="#2563eb"/><text x="80" y="108" fill="#334155" font-family="Arial,sans-serif" font-size="17">High-dimensional configuration space</text><text x="590" y="100" fill="#334155" font-family="Arial,sans-serif" font-size="17">Selected path R(s)</text><text x="285" y="337" fill="#334155" font-family="Arial,sans-serif" font-size="17">The plotted energy E(R(s)) is not the entire PES</text><text x="34" y="375" font-family="Arial,sans-serif" font-size="14" fill="#64748b">A conceptual projection: every point of the path is a complete atomic configuration.</text></svg>